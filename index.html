<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Portfolio de Mathis Thibaut, Administrateur Systemes, Reseaux et Securite. Bachelor ASRBD obtenu, en Master Architecte Virtualisation & Cloud (EPSI Lille), alternance chez Patoux Equipagri.">
<title>Mathis Thibaut — Portfolio</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="canonical" href="https://mathis-thibaut.github.io/">
<meta name="theme-color" content="#0c0e11">
<meta property="og:type" content="website">
<meta property="og:title" content="Mathis Thibaut — Administrateur Systèmes, Réseaux &amp; Sécurité">
<meta property="og:description" content="Portfolio de formation (EPSI Lille, BTS SIO, Bachelor SysOps ASRBD, Master Architecte Virtualisation & Cloud) et d'alternance chez Patoux Equipagri : projets détaillés en infrastructure, réseau, sécurité et développement.">
<meta property="og:url" content="https://mathis-thibaut.github.io/">
<meta property="og:locale" content="fr_FR">
<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="Mathis Thibaut — Portfolio">
<meta name="twitter:description" content="Administrateur Systèmes, Réseaux &amp; Sécurité — EPSI Lille &amp; Patoux Equipagri.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#faf9f6; --surface:#ffffff; --surface-2:#f3f1ec; --line:#e6e2da;
    --text:#1c1b19; --muted:#615c54; --muted-2:#948e83;
    --accent:#c2540d; --accent-dim:#c2540d1a;
    --ok:#1f8a52; --warn:#a5760a; --crit:#c23b3b;
    --mono:'JetBrains Mono', ui-monospace, Consolas, monospace;
    --sans:'IBM Plex Sans', system-ui, -apple-system, sans-serif;
    --sidebar-w: 272px;
    --topbar-h: 56px;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#15171b; --surface:#1b1e23; --surface-2:#22262c; --line:#2d323a;
      --text:#e9ebee; --muted:#9aa1a9; --muted-2:#666d75;
      --accent:#ff9a5c; --accent-dim:#ff9a5c26;
      --ok:#57d38c; --warn:#ffcc66; --crit:#ff7a7a;
    }
  }
  :root[data-theme="light"]{
    --bg:#faf9f6; --surface:#ffffff; --surface-2:#f3f1ec; --line:#e6e2da;
    --text:#1c1b19; --muted:#615c54; --muted-2:#948e83;
    --accent:#c2540d; --accent-dim:#c2540d1a; --ok:#1f8a52; --warn:#a5760a; --crit:#c23b3b;
  }
  :root[data-theme="dark"]{
    --bg:#15171b; --surface:#1b1e23; --surface-2:#22262c; --line:#2d323a;
    --text:#e9ebee; --muted:#9aa1a9; --muted-2:#666d75;
    --accent:#ff9a5c; --accent-dim:#ff9a5c26; --ok:#57d38c; --warn:#ffcc66; --crit:#ff7a7a;
  }

  *{ box-sizing:border-box; }
  html, body{ height:100%; }
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:var(--sans); line-height:1.55;
  }
  ::selection{ background:var(--accent-dim); color:var(--text); }
  a{ color:var(--accent); text-decoration:none; }
  a:hover{ text-decoration:underline; }
  a:focus-visible, button:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; border-radius:2px; }
  code, .mono{ font-family:var(--mono); }
  h1,h2,h3,h4{ font-family:var(--sans); font-weight:700; text-wrap:balance; margin:0; }
  p{ margin:0; }
  ul{ margin:0; padding:0; }

  /* ---------------- APP SHELL ---------------- */
  .topbar{
    position:sticky; top:env(safe-area-inset-top,0px); z-index:40;
    height:var(--topbar-h); display:flex; align-items:center; gap:14px;
    padding-inline:16px; background:var(--surface); border-bottom:1px solid var(--line);
  }
  .topbar .brand{ font-family:var(--mono); font-weight:700; font-size:14px; letter-spacing:.02em; }
  .topbar .brand .accent{ color:var(--accent); }
  .navtoggle{
    display:none; background:none; border:1px solid var(--line); color:var(--text);
    width:34px; height:34px; border-radius:6px; cursor:pointer; font-size:16px;
    align-items:center; justify-content:center;
  }
  .topbar-spacer{ flex:1; }
  .topbar-mail{ font-family:var(--mono); font-size:12px; color:var(--muted); }
  .topbar-links{ display:flex; align-items:center; gap:18px; }
  .topbar-links a{ font-family:var(--mono); font-size:12px; color:var(--muted); }
  .topbar-links a:hover{ color:var(--accent); }
  @media (max-width:640px){ .topbar-mail{ display:none; } }

  .shell{ display:flex; min-height:calc(100% - var(--topbar-h)); }

  .sidebar{
    width:var(--sidebar-w); flex:none; border-right:1px solid var(--line);
    background:var(--surface); padding:20px 14px 40px;
    position:sticky; top:var(--topbar-h); height:calc(100vh - var(--topbar-h)); overflow-y:auto;
  }
  .nav-group{ margin-bottom:22px; }
  .nav-group-title{
    font-family:var(--mono); font-size:10.5px; letter-spacing:.09em; text-transform:uppercase;
    color:var(--muted-2); padding:0 10px; margin-bottom:6px;
  }
  .nav-group-sub{ font-size:10px; color:var(--muted-2); padding:0 10px 6px; }
  .nav-link{
    display:block; padding:8px 10px; border-radius:6px; font-size:13.5px;
    color:var(--muted); cursor:pointer; border:1px solid transparent;
  }
  .nav-link:hover{ color:var(--text); background:var(--surface-2); text-decoration:none; }
  .nav-link.active{ color:var(--accent); background:var(--accent-dim); border-color:color-mix(in srgb, var(--accent) 35%, transparent); font-weight:600; }

  main.content{ flex:1; min-width:0; padding: 40px 40px 80px; max-width:920px; }
  @media (max-width: 1000px){
    main.content{ padding: 28px 20px 60px; }
  }

  .sidebar-backdrop{ display:none; }

  @media (max-width: 880px){
    .navtoggle{ display:flex; }
    .sidebar{
      position:fixed; left:0; top:var(--topbar-h); height:calc(100vh - var(--topbar-h));
      transform:translateX(-100%); transition:transform .2s ease; z-index:50;
      box-shadow:2px 0 24px rgba(0,0,0,.35);
    }
    .sidebar.open{ transform:translateX(0); }
    .sidebar-backdrop.open{
      display:block; position:fixed; inset:var(--topbar-h) 0 0 0; background:rgba(0,0,0,.45); z-index:45;
    }
  }

  [hidden]{ display:none !important; }

  /* ---------------- SHARED PAGE ELEMENTS ---------------- */
  .eyebrow{
    font-family:var(--mono); font-size:12px; letter-spacing:.12em; text-transform:uppercase;
    color:var(--muted); display:flex; align-items:center; gap:8px; margin-bottom:14px;
  }
  .eyebrow::before{ content:""; width:7px; height:7px; border-radius:50%; background:var(--ok); box-shadow:0 0 0 3px var(--surface-2); flex:none; }
  h2.page-title{ font-size:clamp(24px,3.6vw,32px); margin-bottom:8px; }
  .section-sub{ color:var(--muted); font-size:14.5px; margin-bottom:28px; max-width:64ch; }
  .lede{ color:var(--muted); max-width:64ch; }

  /* ---------------- HOME ---------------- */
  .hero-title{ font-size:clamp(32px,5.4vw,52px); line-height:1.05; letter-spacing:-.01em; }
  .hero-title .accent{ color:var(--accent); }
  .hero-role{ font-family:var(--mono); color:var(--muted); font-size:clamp(14px,2vw,16px); margin-top:14px; }
  .hero-lede{ margin-top:18px; max-width:66ch; color:var(--muted); font-size:15.5px; }
  .statusbar{
    font-family:var(--mono); font-size:12px; color:var(--muted-2);
    display:flex; flex-wrap:wrap; gap:6px 18px; padding-bottom:20px; margin-bottom:30px;
    border-bottom:1px dashed var(--line);
  }
  .statusbar span b{ color:var(--ok); font-weight:600; }
  .stat-row{
    display:grid; grid-template-columns:repeat(auto-fit,minmax(120px,1fr)); gap:1px;
    background:var(--line); border:1px solid var(--line); margin-top:34px; border-radius:6px; overflow:hidden;
  }
  .stat{ background:var(--surface); padding:14px 16px; }
  .stat .n{ font-family:var(--mono); font-size:20px; font-weight:700; color:var(--accent); }
  .stat .l{ font-size:11.5px; color:var(--muted); margin-top:3px; }

  .photo-grid{ display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin-top:40px; }
  .photo-grid a{ position:relative; display:block; aspect-ratio:4/3; border-radius:10px; overflow:hidden; border:1px solid var(--line); background:var(--surface-2); }
  .photo-grid a:hover{ border-color:var(--accent); }
  .photo-grid img{ width:100%; height:100%; object-fit:cover; display:block; transition:transform .25s ease; }
  .photo-grid a:hover img{ transform:scale(1.05); }
  .photo-grid .pg-label{
    position:absolute; left:0; right:0; bottom:0; padding:8px 10px 7px;
    font-family:var(--mono); font-size:11px; color:#fff;
    background:linear-gradient(to top, rgba(0,0,0,.72), rgba(0,0,0,0));
  }
  .photo-grid a:nth-child(1){ grid-column:span 2; grid-row:span 2; }
  @media (max-width:760px){
    .photo-grid{ grid-template-columns:repeat(2,1fr); }
    .photo-grid a:nth-child(1){ grid-column:span 2; grid-row:span 1; }
  }

  .year-cards{ display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:14px; margin-top:36px; }
  .year-card{
    background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:18px;
    cursor:pointer; display:flex; flex-direction:column; gap:6px;
  }
  .year-card:hover{ border-color:var(--accent); }
  .year-card .yc-label{ font-weight:700; font-size:15px; }
  .year-card .yc-sub{ font-family:var(--mono); font-size:11.5px; color:var(--muted); }
  .year-card .yc-count{ font-family:var(--mono); font-size:11px; color:var(--accent); margin-top:6px; }

  .about-grid{ display:grid; grid-template-columns:1.3fr 1fr; gap:40px; margin-top:44px; }
  @media (max-width:640px){ .about-grid{ grid-template-columns:1fr; } }
  .about-grid p + p{ margin-top:14px; }
  .kv-list{ display:flex; flex-direction:column; border:1px solid var(--line); border-radius:8px; overflow:hidden; }
  .kv-row{ display:flex; justify-content:space-between; gap:12px; padding:11px 15px; font-size:12.5px; border-bottom:1px solid var(--line); background:var(--surface); }
  .kv-row:last-child{ border-bottom:none; }
  .kv-row .k{ color:var(--muted); }
  .kv-row .v{ font-family:var(--mono); text-align:right; }

  /* ---------------- TIMELINE (formation) ---------------- */
  .timeline{ display:flex; flex-direction:column; border-left:2px solid var(--line); margin-left:6px; }
  .tl-item{ position:relative; padding:0 0 28px 26px; }
  .tl-item:last-child{ padding-bottom:0; }
  .tl-item::before{ content:""; position:absolute; left:-7px; top:2px; width:12px; height:12px; border-radius:50%; background:var(--surface); border:2px solid var(--accent); }
  .tl-item.current::before{ background:var(--accent); }
  .tl-date{ font-family:var(--mono); font-size:12px; color:var(--accent); letter-spacing:.04em; }
  .tl-title{ font-weight:600; margin-top:4px; }
  .tl-desc{ color:var(--muted); font-size:13.5px; margin-top:4px; max-width:60ch; }

  /* ---------------- SKILLS ---------------- */
  .skill-group{ margin-bottom:24px; }
  .skill-group-title{ font-family:var(--mono); font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted-2); margin-bottom:12px; }
  .skill-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(250px,1fr)); gap:12px; }
  .skill-card{ background:var(--surface); border:1px solid var(--line); border-radius:8px; padding:14px 16px; }
  .skill-head{ display:flex; align-items:baseline; justify-content:space-between; gap:10px; margin-bottom:5px; }
  .skill-name{ font-weight:600; font-size:14px; }
  .skill-level{ font-family:var(--mono); font-size:10px; letter-spacing:.05em; text-transform:uppercase; padding:2px 7px; border-radius:99px; white-space:nowrap; }
  .lvl-autonome{ color:var(--ok); background:color-mix(in srgb, var(--ok) 16%, transparent); }
  .lvl-solide{ color:var(--warn); background:color-mix(in srgb, var(--warn) 16%, transparent); }
  .skill-desc{ font-size:12.5px; color:var(--muted); }

  /* ---------------- PROJECT LIST FALLBACK ---------------- */
  .arc-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:14px; }
  .arc-card{ background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:16px 18px; cursor:pointer; display:flex; flex-direction:column; gap:8px; }
  .arc-card:hover{ border-color:var(--accent); }
  .arc-card h3{ font-size:14.5px; }
  .arc-card .arc-tag{ font-family:var(--mono); font-size:10.5px; color:var(--accent); }
  .arc-card p{ font-size:12.5px; color:var(--muted); }

  /* ---------------- PROJECT DETAIL ---------------- */
  .back-link{ font-family:var(--mono); font-size:12px; color:var(--muted); display:inline-block; margin-bottom:18px; cursor:pointer; }
  .back-link:hover{ color:var(--accent); }
  .proj-tag{
    font-family:var(--mono); font-size:11px; letter-spacing:.05em; text-transform:uppercase;
    color:var(--accent); border:1px solid color-mix(in srgb, var(--accent) 40%, transparent);
    background:var(--accent-dim); padding:3px 9px; border-radius:99px; display:inline-block; margin-bottom:12px;
  }
  .proj-tag.flagship{ color:var(--crit); border-color:color-mix(in srgb, var(--crit) 45%, transparent); background:color-mix(in srgb, var(--crit) 12%, transparent); }
  .proj-title{ font-size:clamp(24px,3.8vw,34px); }
  .proj-summary{ color:var(--muted); font-size:15px; margin-top:12px; max-width:66ch; }
  .proj-team{ font-family:var(--mono); font-size:11.5px; color:var(--muted-2); margin-top:10px; }
  .proj-stack{ display:flex; flex-wrap:wrap; gap:8px; margin-top:18px; }
  .stack-tag{ font-family:var(--mono); font-size:11px; border:1px solid var(--line); color:var(--muted); padding:4px 10px; border-radius:99px; }
  .proj-links{ display:flex; gap:16px; margin-top:16px; }
  .proj-links a{ font-family:var(--mono); font-size:12.5px; }

  .proj-body{ margin-top:32px; display:flex; flex-direction:column; gap:26px; }
  .proj-section h4{ font-family:var(--mono); font-size:12px; letter-spacing:.06em; text-transform:uppercase; color:var(--accent); margin-bottom:8px; }
  .proj-section p{ font-size:14.5px; color:var(--text); line-height:1.65; }

  .code-block{ background:var(--surface); border:1px solid var(--line); border-radius:8px; overflow:hidden; margin-top:8px; }
  .code-block .cb-label{ font-family:var(--mono); font-size:11px; color:var(--muted); padding:9px 14px; border-bottom:1px solid var(--line); background:var(--surface-2); }
  .code-block pre{ margin:0; padding:16px; overflow-x:auto; font-family:var(--mono); font-size:12.5px; line-height:1.6; color:var(--text); }

  .gallery{ display:grid; grid-template-columns:repeat(auto-fit,minmax(280px,1fr)); gap:16px; margin-top:10px; }
  .gallery figure{ margin:0; background:var(--surface); border:1px solid var(--line); border-radius:10px; overflow:hidden; }
  .gallery img{ display:block; width:100%; height:auto; border-bottom:1px solid var(--line); cursor:zoom-in; }
  .gallery figcaption{ padding:10px 12px; font-size:12px; color:var(--muted); }

  .proj-nav{ display:flex; justify-content:space-between; margin-top:44px; padding-top:20px; border-top:1px solid var(--line); font-family:var(--mono); font-size:12.5px; }

  /* ---------------- LIGHTBOX ---------------- */
  .lightbox{ position:fixed; inset:0; background:rgba(5,6,8,.9); z-index:100; display:flex; align-items:center; justify-content:center; padding:24px; cursor:zoom-out; }
  .lightbox img{ max-width:100%; max-height:100%; border-radius:6px; box-shadow:0 10px 40px rgba(0,0,0,.5); }

  /* ---------------- ALTERNANCE PROJECT GRID ---------------- */
  .proj-grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(250px,1fr)); gap:16px; margin-top:10px; }
  .proj-card{ background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:18px; display:flex; flex-direction:column; gap:8px; cursor:pointer; }
  .proj-card:hover{ border-color:var(--accent); }
  .proj-card .pj-tag{ font-family:var(--mono); font-size:10.5px; color:var(--accent); letter-spacing:.05em; }
  .proj-card h3{ font-size:15px; }
  .proj-card p{ font-size:12.5px; color:var(--muted); }

  .incident-cta{
    background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:22px;
    display:flex; justify-content:space-between; align-items:center; gap:16px; cursor:pointer; margin-top:10px;
    flex-wrap:wrap;
  }
  .incident-cta:hover{ border-color:var(--crit); }
  .incident-cta .sev-tag{
    font-family:var(--mono); font-size:11px; letter-spacing:.08em; text-transform:uppercase;
    color:var(--crit); border:1px solid color-mix(in srgb, var(--crit) 45%, transparent);
    background:color-mix(in srgb, var(--crit) 12%, transparent);
    padding:3px 9px; border-radius:5px; display:inline-block; margin-bottom:8px;
  }
  .incident-cta h3{ font-size:17px; }
  .incident-cta .go{ font-family:var(--mono); font-size:12px; color:var(--muted); }

  /* ---------------- SOFT SKILLS ---------------- */
  .two-col{ display:grid; grid-template-columns:1fr 1fr; gap:36px; }
  @media (max-width:640px){ .two-col{ grid-template-columns:1fr; } }
  .soft-item{ padding:13px 0; border-bottom:1px solid var(--line); }
  .soft-item:last-child{ border-bottom:none; }
  .soft-item h4{ margin:0 0 4px; font-size:14px; font-weight:600; }
  .soft-item p{ font-size:13px; color:var(--muted); }
  .axis-item{ display:flex; gap:12px; padding:13px 0; border-bottom:1px solid var(--line); }
  .axis-item:last-child{ border-bottom:none; }
  .axis-num{ font-family:var(--mono); color:var(--muted-2); font-size:13px; flex:none; padding-top:1px; }
  .axis-item p{ font-size:13px; color:var(--muted); }
  .axis-item b{ color:var(--text); }

  /* ---------------- CONTACT ---------------- */
  .contact-box{
    background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:30px;
    display:flex; flex-wrap:wrap; justify-content:space-between; align-items:center; gap:20px;
  }
  .contact-box h2{ margin-bottom:6px; font-size:21px; }
  .mail-btn{ font-family:var(--mono); font-size:14px; font-weight:600; background:var(--accent); color:#161005; padding:12px 20px; border-radius:7px; white-space:nowrap; }
  .mail-btn:hover{ text-decoration:none; filter:brightness(1.08); }

  section.page{ padding-bottom:8px; }
</style>
</head>
<body>


<div class="topbar">
  <button class="navtoggle" id="navToggle" aria-label="Ouvrir la navigation">☰</button>
  <div class="brand">mthibaut<span class="accent">@</span>portfolio</div>
  <div class="topbar-spacer"></div>
  <div class="topbar-links">
    <a href="https://github.com/mathis-thibaut" target="_blank" rel="noopener">GitHub ↗</a>
    <div class="topbar-mail">mathisthibaut317@gmail.com</div>
  </div>
</div>

<div class="shell">
  <div class="sidebar-backdrop" id="sidebarBackdrop"></div>
  <nav class="sidebar" id="sidebar">
    <div class="nav-group">
      <a class="nav-link" data-route="home">Accueil</a>
      <a class="nav-link" data-route="formation">Formation</a>
      <a class="nav-link" data-route="skills">Compétences</a>
    </div>
    <div id="navGroups"></div>
    <div class="nav-group">
      <a class="nav-link" data-route="softskills">Bilan &amp; regard critique</a>
      <a class="nav-link" data-route="contact">Contact</a>
    </div>
  </nav>

  <main class="content" id="content"></main>
</div>

<script src="data.js"></script>
<script>
(function(){
  "use strict";
  var DATA = window.PORTFOLIO_DATA;
  var content = document.getElementById('content');
  var sidebar = document.getElementById('sidebar');
  var backdrop = document.getElementById('sidebarBackdrop');

  function esc(s){
    return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }

  // -------- Build sidebar nav groups from data --------
  var navGroupsEl = document.getElementById('navGroups');
  DATA.years.forEach(function(y){
    var group = document.createElement('div');
    group.className = 'nav-group';
    var title = document.createElement('div');
    title.className = 'nav-group-title';
    title.textContent = y.label;
    var sub = document.createElement('div');
    sub.className = 'nav-group-sub';
    sub.textContent = y.sub;
    group.appendChild(title);
    group.appendChild(sub);
    DATA.projects.filter(function(p){ return p.year === y.id; }).forEach(function(p){
      var a = document.createElement('a');
      a.className = 'nav-link';
      a.setAttribute('data-route', 'p-' + p.id);
      a.textContent = p.title;
      group.appendChild(a);
    });
    navGroupsEl.appendChild(group);
  });

  // -------- Mobile nav toggle --------
  document.getElementById('navToggle').addEventListener('click', function(){
    sidebar.classList.toggle('open');
    backdrop.classList.toggle('open');
  });
  backdrop.addEventListener('click', function(){
    sidebar.classList.remove('open');

  function sk(name, level, desc){

  function renderYear(yid){

  function renderProject(id){
    var p = findProject(id);
    if(!p){ navigate('home'); return; }
    var y = yearLabel(p.year);
    var html = '';
    html += '<span class="back-link" data-route="year-' + p.year + '">← ' + esc(y.label) + '</span>';
    html += '<div><span class="proj-tag' + (p.flagship ? ' flagship' : '') + '">' + esc(p.tag) + '</span></div>';
    html += '<h1 class="proj-title">' + esc(p.title) + '</h1>';
    html += '<p class="proj-summary">' + esc(p.summary) + '</p>';
    if(p.team) html += '<div class="proj-team">' + esc(p.team) + '</div>';
    if(p.stack && p.stack.length){
      html += '<div class="proj-stack">' + p.stack.map(function(s){ return '<span class="stack-tag">' + esc(s) + '</span>'; }).join('') + '</div>';
    }
    if(p.links && p.links.length){
      html += '<div class="proj-links">' + p.links.map(function(l){ return '<a href="' + esc(l.url) + '" target="_blank" rel="noopener">' + esc(l.label) + ' ↗</a>'; }).join('') + '</div>';
    }
    html += '<div class="proj-body">';
    (p.sections || []).forEach(function(s){
      html += '<div class="proj-section"><h4>' + esc(s.h) + '</h4><p>' + s.b + '</p></div>';
    });
    if(p.code){
      html += '<div class="proj-section"><div class="code-block"><div class="cb-label">' + esc(p.code.label) + '</div><pre>' + esc(p.code.content) + '</pre></div></div>';
    }
    if(p.images && p.images.length){
      html += '<div class="proj-section"><h4>Preuves &amp; captures</h4><div class="gallery">';
      p.images.forEach(function(img){
        html += '<figure><img src="' + esc(img.src) + '" alt="' + esc(img.caption) + '" loading="lazy"><figcaption>' + esc(img.caption) + '</figcaption></figure>';
      });
      html += '</div></div>';
    }
    html += '</div>';

    // prev/next within same year
    var siblings = DATA.projects.filter(function(x){ return x.year === p.year; });
    var idx = siblings.findIndex(function(x){ return x.id === p.id; });
    var prev = siblings[idx-1], next = siblings[idx+1];
    html += '<div class="proj-nav">';
    html += prev ? '<span data-route="p-' + prev.id + '">← ' + esc(prev.title) + '</span>' : '<span></span>';
    html += next ? '<span data-route="p-' + next.id + '">' + esc(next.title) + ' →</span>' : '<span></span>';
    html += '</div>';

    content.innerHTML = html;
  }

  // -------- Router --------
  var routes = {
    'home': renderHome,
    'formation': renderFormation,
    'skills': renderSkills,
    'softskills': renderSoftSkills,
    'contact': renderContact
  };

  function navigate(route){
    if(location.hash.slice(1) !== route){
      location.hash = route;
    } else {
      render(route);
    }
  }

  function render(route){
    if(!route) route = 'home';
    if(routes[route]){
      routes[route]();
    } else if(route.indexOf('year-') === 0){
      renderYear(route.slice(5));
    } else if(route.indexOf('p-') === 0){
      renderProject(route.slice(2));
    } else {
      renderHome();
    }
    // active state
    document.querySelectorAll('.nav-link').forEach(function(a){
      a.classList.toggle('active', a.getAttribute('data-route') === route);
    });
    sidebar.classList.remove('open');
    backdrop.classList.remove('open');
    window.scrollTo(0,0);
    try{
      var main = document.querySelector('main.content');
      if(main) main.scrollTop = 0;
    }catch(e){}
  }

  window.addEventListener('hashchange', function(){ render(location.hash.slice(1)); });
  render(location.hash.slice(1) || 'home');
})();
